apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis
type: Opaque
stringData:
  # Replace through External Secrets, Sealed Secrets, or the platform secret manager.
  SECRET_KEY: replace-with-at-least-32-random-characters
  DATABASE_URL: mysql+pymysql://aegis:replace@mysql-ha.database.svc.cluster.local:3306/aegis?charset=utf8mb4
  INITIAL_ADMIN_EMAIL: admin@example.com
  INITIAL_ADMIN_PASSWORD: replace-with-a-strong-one-time-password
  LLM_API_KEY: ""
  LLM_CANARY_API_KEY: ""
  # Stable hashing secret: rotate only when intentionally rebucketing new conversations.
  EXPERIMENT_SALT: replace-with-a-long-random-routing-secret
  EMBEDDING_API_KEY: ""
  QDRANT_API_KEY: ""
