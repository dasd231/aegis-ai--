apiVersion: batch/v1
kind: Job
metadata:
  name: aegis-migrate-20260723-0012
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis-migration
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-migration
    spec:
      serviceAccountName: aegis-runtime
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: ghcr.io/replace-with-owner/aegis-backend:2026.07.22
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: aegis-config}
            - secretRef: {name: aegis-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
