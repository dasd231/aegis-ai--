# Optional stable/canary reference; deliberately excluded from kustomization.yaml.
# Validate both image/model combinations on target GPUs and pin image digests before production.
apiVersion: apps/v1
kind: Deployment
metadata: {name: vllm-stable, namespace: aegis}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: vllm, track: stable}
  template:
    metadata:
      labels: {app.kubernetes.io/name: vllm, app.kubernetes.io/part-of: aegis, track: stable}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 120
      nodeSelector: {accelerator: nvidia-gpu}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: vllm, track: stable}
      containers:
        - name: vllm
          image: vllm/vllm-openai@sha256:replace-with-tested-stable-digest
          args:
            - --model=Qwen/Qwen2.5-VL-7B-Instruct
            - --served-model-name=Qwen/Qwen2.5-VL-7B-Instruct
            - --tensor-parallel-size=2
            - --max-model-len=16384
            - --max-num-seqs=64
            - --gpu-memory-utilization=0.90
            - --enable-prefix-caching
            - --limit-mm-per-prompt=image=10
            - --disable-log-requests
          ports: [{name: http, containerPort: 8000}]
          startupProbe: {httpGet: {path: /health, port: http}, failureThreshold: 60, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          resources:
            requests: {cpu: "4", memory: 24Gi, nvidia.com/gpu: "2"}
            limits: {cpu: "12", memory: 64Gi, nvidia.com/gpu: "2"}
          volumeMounts:
            - {name: model-cache, mountPath: /root/.cache/huggingface}
      volumes:
        - name: model-cache
          persistentVolumeClaim: {claimName: vllm-model-cache}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-stable
  namespace: aegis
  labels: {app.kubernetes.io/name: vllm, track: stable}
spec:
  selector: {app.kubernetes.io/name: vllm, track: stable}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: vllm-canary, namespace: aegis}
spec:
  # Keep a physically separate warm pool. Never replace stable Pods in-place.
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: vllm, track: canary}
  template:
    metadata:
      labels: {app.kubernetes.io/name: vllm, app.kubernetes.io/part-of: aegis, track: canary}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 120
      nodeSelector: {accelerator: nvidia-gpu-canary}
      containers:
        - name: vllm
          image: vllm/vllm-openai@sha256:replace-with-tested-canary-digest
          args:
            - --model=replace-with-canary-model
            - --served-model-name=Qwen/Qwen2.5-VL-7B-Instruct-canary
            - --tensor-parallel-size=2
            - --max-model-len=16384
            - --max-num-seqs=32
            - --gpu-memory-utilization=0.88
            - --enable-prefix-caching
            - --limit-mm-per-prompt=image=10
            - --disable-log-requests
          ports: [{name: http, containerPort: 8000}]
          startupProbe: {httpGet: {path: /health, port: http}, failureThreshold: 90, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          resources:
            requests: {cpu: "4", memory: 24Gi, nvidia.com/gpu: "2"}
            limits: {cpu: "12", memory: 64Gi, nvidia.com/gpu: "2"}
          volumeMounts:
            - {name: model-cache, mountPath: /root/.cache/huggingface}
      volumes:
        - name: model-cache
          persistentVolumeClaim: {claimName: vllm-canary-model-cache}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-canary
  namespace: aegis
  labels: {app.kubernetes.io/name: vllm, track: canary}
spec:
  selector: {app.kubernetes.io/name: vllm, track: canary}
  ports: [{name: http, port: 8000, targetPort: http}]
