name: aegis-ai-service

services:
  mysql:
    image: ${BASE_IMAGE_REGISTRY:-docker.io/library}/mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?copy .env.example to .env and configure it}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [internal]

  backend:
    build:
      context: ./backend
      args:
        BASE_IMAGE_REGISTRY: ${BASE_IMAGE_REGISTRY:-docker.io/library}
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:?set a random SECRET_KEY of at least 32 characters}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      PROVIDER_ALLOWED_HOSTS: ${PROVIDER_ALLOWED_HOSTS:-api.deepseek.com,api.openai.com,openrouter.ai,dashscope.aliyuncs.com,dashscope-intl.aliyuncs.com,dashscope-us.aliyuncs.com,.maas.aliyuncs.com,localhost,127.0.0.1,host.docker.internal,vllm-stable,vllm-canary,ollama}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-false}
      AUTO_SEED: ${AUTO_SEED:-true}
      INGESTION_MODE: ${INGESTION_MODE:-inline}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?set INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?set a strong INITIAL_ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Hong_Kong}
      DAILY_QUESTION_LIMIT: ${DAILY_QUESTION_LIMIT:-100}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_FAILURE_WINDOW_SECONDS: ${LOGIN_FAILURE_WINDOW_SECONDS:-900}
      LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-900}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-800}
      EXPERIMENT_SALT: ${EXPERIMENT_SALT:-development-experiment-salt}
      EXPERIMENT_WHITELIST_TENANT_IDS: ${EXPERIMENT_WHITELIST_TENANT_IDS:-}
      EXPERIMENT_WHITELIST_USER_IDS: ${EXPERIMENT_WHITELIST_USER_IDS:-}
      EXPERIMENT_WHITELIST_CONVERSATION_IDS: ${EXPERIMENT_WHITELIST_CONVERSATION_IDS:-}
      EXPERIMENT_BLACKLIST_TENANT_IDS: ${EXPERIMENT_BLACKLIST_TENANT_IDS:-}
      EXPERIMENT_BLACKLIST_USER_IDS: ${EXPERIMENT_BLACKLIST_USER_IDS:-}
      EXPERIMENT_BLACKLIST_CONVERSATION_IDS: ${EXPERIMENT_BLACKLIST_CONVERSATION_IDS:-}
      MODEL_CANARY_PERCENT: ${MODEL_CANARY_PERCENT:-0}
      EMBEDDING_CANARY_PERCENT: ${EMBEDDING_CANARY_PERCENT:-0}
      PROMPT_CANARY_PERCENT: ${PROMPT_CANARY_PERCENT:-0}
      RAG_CANARY_PERCENT: ${RAG_CANARY_PERCENT:-0}
      SERVICE_CANARY_PERCENT: ${SERVICE_CANARY_PERCENT:-0}
      SHADOW_CANARY_PERCENT: ${SHADOW_CANARY_PERCENT:-0}
      EXPERIMENT_STABLE_INTENTS: ${EXPERIMENT_STABLE_INTENTS:-投诉,售后问题}
      LLM_CANARY_BASE_URL: ${LLM_CANARY_BASE_URL:-}
      LLM_CANARY_API_KEY: ${LLM_CANARY_API_KEY:-}
      LLM_CANARY_MODEL: ${LLM_CANARY_MODEL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local_hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_SEND_DIMENSIONS: ${EMBEDDING_SEND_DIMENSIONS:-true}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-20}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-2}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      EMBEDDING_MAX_CONCURRENCY: ${EMBEDDING_MAX_CONCURRENCY:-64}
      EMBEDDING_QUEUE_TIMEOUT_SECONDS: ${EMBEDDING_QUEUE_TIMEOUT_SECONDS:-2}
      EMBEDDING_QUERY_CACHE_SIZE: ${EMBEDDING_QUERY_CACHE_SIZE:-512}
      EMBEDDING_QUERY_CACHE_TTL_SECONDS: ${EMBEDDING_QUERY_CACHE_TTL_SECONDS:-300}
      EMBEDDING_STABLE_VERSION: ${EMBEDDING_STABLE_VERSION:-embedding-stable-v1}
      EMBEDDING_CANARY_MODEL: ${EMBEDDING_CANARY_MODEL:-}
      EMBEDDING_CANARY_DIMENSIONS: ${EMBEDDING_CANARY_DIMENSIONS:-512}
      EMBEDDING_CANARY_SEND_DIMENSIONS: ${EMBEDDING_CANARY_SEND_DIMENSIONS:-true}
      EMBEDDING_CANARY_BASE_URL: ${EMBEDDING_CANARY_BASE_URL:-}
      EMBEDDING_CANARY_API_KEY: ${EMBEDDING_CANARY_API_KEY:-}
      EMBEDDING_CANARY_BATCH_SIZE: ${EMBEDDING_CANARY_BATCH_SIZE:-10}
      EMBEDDING_CANARY_VERSION: ${EMBEDDING_CANARY_VERSION:-embedding-canary-v1}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-12}
      RETRIEVAL_FINAL_K: ${RETRIEVAL_FINAL_K:-6}
      RETRIEVAL_MAX_DISTANCE: ${RETRIEVAL_MAX_DISTANCE:-0.68}
      RETRIEVAL_MIN_LEXICAL_SCORE: ${RETRIEVAL_MIN_LEXICAL_SCORE:-0.08}
      RETRIEVAL_CRITICAL_MARGIN: ${RETRIEVAL_CRITICAL_MARGIN:-0.10}
      RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:-60}
      RETRIEVAL_DENSE_WEIGHT: ${RETRIEVAL_DENSE_WEIGHT:-1.0}
      RETRIEVAL_SPARSE_WEIGHT: ${RETRIEVAL_SPARSE_WEIGHT:-1.0}
      RETRIEVAL_EXPANSION_WEIGHT: ${RETRIEVAL_EXPANSION_WEIGHT:-0.75}
      RAG_STABLE_VERSION: ${RAG_STABLE_VERSION:-hybrid_rrf_v2}
      RAG_CANARY_VERSION: ${RAG_CANARY_VERSION:-multi_rrf_v3}
      RAG_CANARY_TOP_K: ${RAG_CANARY_TOP_K:-20}
      RAG_CANARY_FINAL_K: ${RAG_CANARY_FINAL_K:-6}
      RAG_CANARY_RRF_K: ${RAG_CANARY_RRF_K:-60}
      RAG_CANARY_DENSE_WEIGHT: ${RAG_CANARY_DENSE_WEIGHT:-1.0}
      RAG_CANARY_SPARSE_WEIGHT: ${RAG_CANARY_SPARSE_WEIGHT:-1.0}
      RAG_CANARY_EXPANSION_WEIGHT: ${RAG_CANARY_EXPANSION_WEIGHT:-0.75}
      RAG_CANARY_CANDIDATE_K: ${RAG_CANARY_CANDIDATE_K:-20}
      RAG_CANARY_RERANK_POLICY: ${RAG_CANARY_RERANK_POLICY:-always}
      RAG_CANARY_RERANK_WEIGHT: ${RAG_CANARY_RERANK_WEIGHT:-0.70}
      RAG_CANARY_CONTEXT_CHARS: ${RAG_CANARY_CONTEXT_CHARS:-12000}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-llm_json}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      RERANKER_CANDIDATE_K: ${RERANKER_CANDIDATE_K:-10}
      RERANKER_MIN_CANDIDATES: ${RERANKER_MIN_CANDIDATES:-4}
      RERANKER_WEIGHT: ${RERANKER_WEIGHT:-0.55}
      RERANKER_AMBIGUITY_MARGIN: ${RERANKER_AMBIGUITY_MARGIN:-0.08}
      RERANKER_TIMEOUT_SECONDS: ${RERANKER_TIMEOUT_SECONDS:-10}
      RERANKER_MAX_CONCURRENCY: ${RERANKER_MAX_CONCURRENCY:-8}
      RERANKER_QUEUE_TIMEOUT_SECONDS: ${RERANKER_QUEUE_TIMEOUT_SECONDS:-1.5}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-12000}
      MAX_HISTORY_CHARS: ${MAX_HISTORY_CHARS:-6000}
      HISTORY_TURNS: ${HISTORY_TURNS:-6}
      CHAT_TURN_LEASE_SECONDS: ${CHAT_TURN_LEASE_SECONDS:-300}
      MAX_INFLIGHT_REQUESTS: ${MAX_INFLIGHT_REQUESTS:-200}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-32}
      MULTIMODAL_PROVIDER: ${MULTIMODAL_PROVIDER:-disabled}
      VISION_MODEL: ${VISION_MODEL:-gpt-4o-mini}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_BOOTSTRAP_VALIDATED: ${DASHSCOPE_BOOTSTRAP_VALIDATED:-false}
      UPLOAD_DIR: /app/uploads
      QDRANT_PATH: /app/qdrant_data
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-aegis_knowledge_chunks}
      QDRANT_CANARY_COLLECTION: ${QDRANT_CANARY_COLLECTION:-}
    volumes:
      - uploads_data:/app/uploads
      - qdrant_data:/app/qdrant_data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        BASE_IMAGE_REGISTRY: ${BASE_IMAGE_REGISTRY:-docker.io/library}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

volumes:
  mysql_data:
  uploads_data:
  qdrant_data:

networks:
  internal:
    driver: bridge
